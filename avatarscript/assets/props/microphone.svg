<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150">
  <!-- Microphone handle / stem -->
  <rect x="42" y="55" width="16" height="75" rx="5" fill="#222228" stroke="#111116" stroke-width="2"/>
  <rect x="45" y="125" width="10" height="15" rx="2" fill="#444450"/>
  <!-- Microphone grille / capsule -->
  <ellipse cx="50" cy="38" rx="20" ry="26" fill="#888898" stroke="#333340" stroke-width="3"/>
  <line x1="30" y1="38" x2="70" y2="38" stroke="#333340" stroke-width="2"/>
  <line x1="34" y1="28" x2="66" y2="28" stroke="#333340" stroke-width="2"/>
  <line x1="34" y1="48" x2="66" y2="48" stroke="#333340" stroke-width="2"/>
  <!-- Shiny reflection streak -->
  <line x1="43" y1="20" x2="43" y2="52" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
</svg>