<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Outer rounded badge -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="#181926" stroke="#7C5CFF" stroke-width="8"/>
  <!-- Inner subtle glow frame -->
  <rect x="22" y="22" width="212" height="212" rx="40" fill="#232538" stroke="#363A59" stroke-width="4"/>
  <!-- Stylized play/timeline triangle behind avatar -->
  <polygon points="62,56 210,128 62,200" fill="#2D304D" stroke="#454973" stroke-width="3"/>
  <!-- Avatar shoulders/body -->
  <rect x="74" y="166" width="108" height="60" rx="28" fill="#7C5CFF" stroke="#12131F" stroke-width="6"/>
  <!-- Avatar head -->
  <circle cx="128" cy="116" r="52" fill="#FFE0C8" stroke="#12131F" stroke-width="6"/>
  <!-- Stylized hair/hood accent -->
  <polygon points="76,102 96,58 160,58 180,102 162,84 94,84" fill="#00E5FF" stroke="#12131F" stroke-width="5"/>
  <!-- Left eye (open cyan glow) -->
  <circle cx="108" cy="116" r="8" fill="#12131F"/>
  <circle cx="105" cy="113" r="3" fill="#00E5FF"/>
  <!-- Right eye (wink/happy arc) -->
  <line x1="138" y1="114" x2="154" y2="114" stroke="#12131F" stroke-width="6" stroke-linecap="round"/>
  <!-- Expressive happy mouth -->
  <polygon points="114,134 142,134 134,150 122,150" fill="#FF4D79" stroke="#12131F" stroke-width="4"/>
  <!-- ".ava" code tag pill at bottom right -->
  <rect x="138" y="190" width="88" height="36" rx="12" fill="#00E5FF" stroke="#12131F" stroke-width="5"/>
  <circle cx="156" cy="212" r="4" fill="#12131F"/>
  <polygon points="168,218 178,198 188,218" fill="none" stroke="#12131F" stroke-width="4"/>
  <polygon points="194,198 202,218 210,198" fill="none" stroke="#12131F" stroke-width="4"/>
</svg>
