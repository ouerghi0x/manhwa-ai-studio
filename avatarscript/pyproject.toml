[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "avatarscript"
version = "0.1.0"
description = "A declarative Python DSL for 2D animated reaction avatars"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lark>=1.1.9",
    "pygame-ce>=2.5.0",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
    "moviepy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
avatarscript = "avatarscript.cli:main"

[tool.setuptools.packages.find]
include = ["avatarscript*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
