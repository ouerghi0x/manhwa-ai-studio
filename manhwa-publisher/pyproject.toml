[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "manhwa-publisher"
version = "1.0.0"
description = "Autonomous YouTube Publishing System for AI video-production agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-api-python-client>=2.140.0",
    "google-auth>=2.30.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "PyYAML>=6.0.1",
    "Pillow>=10.3.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
manhwa-publisher = "publisher.cli:main"

[tool.setuptools.packages.find]
include = ["publisher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that require real YouTube OAuth credentials (deselect with '-m \"not integration\"')",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
